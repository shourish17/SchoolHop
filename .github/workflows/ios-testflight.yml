name: Upload Existing Verified SchoolHop Build 10

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: schoolhop-upload-existing-build-10
  cancel-in-progress: false

jobs:
  upload-existing:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45
    defaults:
      run:
        working-directory: approved-source
    env:
      APPROVED_SOURCE_COMMIT: 9af0c6b3e9a9b2418ec65d7696f0742ce59f007a
      APPROVED_IPA_SHA256: 5a8532db93ca885bcb59406c9fdca0c77021414be566ca7e8ac90cbb52bf6bf2
      APPROVED_BUILD_RUN: "39491956703"
      APPROVED_IPA_ARTIFACT: "12295358007"
      APPROVED_REPORT_ARTIFACT: "12295722100"
    steps:
      - name: Check out upload-only helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: upload-tools
          persist-credentials: false

      - name: Check out the approved verification tools without building
        uses: actions/checkout@v4
        with:
          ref: 9af0c6b3e9a9b2418ec65d7696f0742ce59f007a
          path: approved-source
          persist-credentials: false

      - name: Verify original build and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/shourish17/SchoolHop/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['APPROVED_SOURCE_COMMIT']
          run = get('actions/runs/' + os.environ['APPROVED_BUILD_RUN'])
          assert run['head_sha'] == os.environ['APPROVED_SOURCE_COMMIT']
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          for variable, name in [('APPROVED_IPA_ARTIFACT', 'schoolhop-testflight-ipa'), ('APPROVED_REPORT_ARTIFACT', 'schoolhop-testflight-build-logs')]:
              artifact = get('actions/artifacts/' + os.environ[variable])
              assert artifact['name'] == name and not artifact['expired']
              assert str(artifact['workflow_run']['id']) == os.environ['APPROVED_BUILD_RUN']
              assert artifact['workflow_run']['head_sha'] == os.environ['APPROVED_SOURCE_COMMIT']
          print('Approved source commit, successful build and original artifact IDs verified')
          PY

      - name: Download existing signed IPA without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: schoolhop-testflight-ipa
          run-id: 39491956703
          github-token: ${{ github.token }}
          path: approved-source/build/existing-ipa

      - name: Download original macOS verification reports
        uses: actions/download-artifact@v4
        with:
          name: schoolhop-testflight-build-logs
          run-id: 39491956703
          github-token: ${{ github.token }}
          path: approved-source/build/original-reports

      - name: Verify immutable IPA bytes against recorded macOS result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          ipas = list(Path('build/existing-ipa').rglob('*.ipa'))
          reports = list(Path('build/original-reports').rglob('ios-signed-verification.json'))
          assert len(ipas) == len(reports) == 1
          report = json.loads(reports[0].read_text())
          assert report['commit'] == os.environ['APPROVED_SOURCE_COMMIT']
          assert report['signed_verification'] is True
          assert report['bundle_id'] == 'com.schoolhop.app' and report['team_id'] == 'G4R38KT942'
          assert report['marketing_version'] == '1.0' and report['build_number'] == '10'
          actual = hashlib.sha256(ipas[0].read_bytes()).hexdigest()
          assert actual == report['ipa_sha256'] == os.environ['APPROVED_IPA_SHA256']
          Path('build/receipts').mkdir(parents=True, exist_ok=True)
          Path('build/receipts/immutable-ipa.json').write_text(json.dumps({
              'source_run': os.environ['APPROVED_BUILD_RUN'], 'source_commit': report['commit'],
              'ipa_sha256': actual, 'version': '1.0', 'build': '10', 'rebuilt': False}, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EXISTING_IPA_PATH=' + str(ipas[0].resolve()) + '\n')
          print('Existing signed IPA matches recorded macOS SHA-256: ' + actual)
          PY

      - name: Reverify unchanged signed IPA
        run: python3 scripts/verify-ios-release.py --phase signed --ipa "$EXISTING_IPA_PATH" --build-number 10 --report build/receipts/signed-ipa-reverification.json

      - name: Validate read-only Apple status checker
        run: ruby -c "$GITHUB_WORKSPACE/upload-tools/.github/scripts/ios-build10-status.rb"

      - name: Confirm build number is not already uploaded
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: ruby "$GITHUB_WORKSPACE/upload-tools/.github/scripts/ios-build10-status.rb" preflight

      - name: Upload only existing approved IPA to Apple
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          ipa = Path(os.environ['EXISTING_IPA_PATH'])
          expected = os.environ['APPROVED_IPA_SHA256']
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == expected
          directory = Path.home() / '.appstoreconnect/private_keys'
          directory.mkdir(parents=True, exist_ok=True, mode=0o700)
          key = directory / ('AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8')
          try:
              with key.open('x') as output:
                  os.chmod(key, 0o600)
                  output.write(os.environ['APP_STORE_CONNECT_API_KEY_P8'].replace('\\n', '\n'))
              result = subprocess.run(['xcrun', 'altool', '--upload-app', '--type', 'ios', '--file', str(ipa),
                  '--apiKey', os.environ['APP_STORE_CONNECT_KEY_ID'], '--apiIssuer', os.environ['APP_STORE_CONNECT_ISSUER_ID']], capture_output=True, text=True)
              receipt = {'source_commit': os.environ['APPROVED_SOURCE_COMMIT'], 'ipa_sha256': expected,
                  'altool_exit_code': result.returncode, 'apple_upload_command_accepted': result.returncode == 0,
                  'rebuilt': False, 'version': '1.0', 'build': '10'}
              Path('build/receipts/apple-upload.json').write_text(json.dumps(receipt, indent=2) + '\n')
              assert hashlib.sha256(ipa.read_bytes()).hexdigest() == expected, 'IPA bytes changed during upload'
              if result.returncode:
                  raise SystemExit('Apple upload failed; raw diagnostic output withheld to protect credentials. No automatic retry.')
              print('Apple accepted the upload command for the unchanged IPA; processing verification follows')
          finally:
              key.unlink(missing_ok=True)
          PY

      - name: Check Apple processing and TestFlight availability without distributing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: ruby "$GITHUB_WORKSPACE/upload-tools/.github/scripts/ios-build10-status.rb" monitor

      - name: Preserve sanitized upload and processing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhop-build10-upload-receipts
          path: approved-source/build/receipts/*.json
          if-no-files-found: warn

      - name: Clean up temporary App Store Connect key
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          fi
