name: Android Build

on:
  workflow_dispatch:
    inputs:
      require_firebase:
        description: Require Firebase configuration for push notifications. Disable only for development builds without push.
        required: true
        default: true
        type: boolean
      version_name:
        description: Optional Android versionName override.
        required: false
        type: string
      version_code:
        description: Optional Android versionCode override. Defaults to the GitHub run number.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: schoolhop-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      EXPOSE_DEVELOPMENT_VERIFICATION_CODES: "true"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ""
      SMTP_FROM_EMAIL: ""
      JWT_SECRET: test-only-ci-secret
      DATABASE_URL: postgresql://schoolhop:schoolhop@localhost:5432/schoolhop
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.25' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      ANDROID_REQUIRE_FIREBASE: ${{ inputs.require_firebase }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Configure Firebase Android
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: node scripts/configure-android-firebase.js

      - name: Run frontend tests
        run: npm test

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend lint
        run: npm run lint

      - name: Install browser for layout regression tests
        run: npx playwright install --with-deps chromium

      - name: Check header layout and Sign Out
        run: npm run test:layout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile backend modules
        run: python -m py_compile app/main.py app/seed.py

      - name: Build Capacitor web assets
        run: npm run android:build

      - name: Validate Capacitor config
        run: npx cap config

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply Android push startup guard
        run: node scripts/patch-capacitor-android-push.js

      - name: Verify Android manifest and version inputs
        run: |
          set -euo pipefail
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="location"' android/app/src/main/AndroidManifest.xml
          if ! [[ "$ANDROID_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::ANDROID_VERSION_CODE must be numeric."
            exit 1
          fi
          echo "Commit SHA: $GITHUB_SHA"
          echo "Application ID: com.schoolhop.app"
          echo "Version name: $ANDROID_VERSION_NAME"
          echo "Version code: $ANDROID_VERSION_CODE"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: schoolhop-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check Android signing secrets
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Android upload keystore
        if: ${{ steps.android-signing.outputs.configured == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: ${{ steps.android-signing.outputs.configured == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release AAB
        if: ${{ steps.android-signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: schoolhop-android-release-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Report unsigned release status
        if: ${{ steps.android-signing.outputs.configured != 'true' }}
        run: |
          echo "::notice::Android signing secrets are not configured. Debug APK was built; signed release AAB is pending ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."

      - name: Git diff whitespace check
        run: git diff --check

      - name: Remove staged Firebase configuration
        if: always()
        run: rm -f android/app/google-services.json

      - name: Build summary
        run: |
          {
            echo "## Android Build"
            echo "- Commit SHA: \`$GITHUB_SHA\`"
            echo "- Application ID: \`com.schoolhop.app\`"
            echo "- Firebase required: \`$ANDROID_REQUIRE_FIREBASE\`"
            echo "- Version name: \`$ANDROID_VERSION_NAME\`"
            echo "- Version code: \`$ANDROID_VERSION_CODE\`"
            echo "- Debug APK artifact: \`schoolhop-android-debug-$GITHUB_SHA\`"
            if [ "${{ steps.android-signing.outputs.configured }}" = "true" ]; then
              echo "- Release AAB artifact: \`schoolhop-android-release-aab-$GITHUB_SHA\`"
              echo "- Signing: configured"
            else
              echo "- Release AAB artifact: pending signing credentials"
              echo "- Signing: not configured"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
