name: Android Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release versionName
        required: true
        default: '1.0.26'
        type: string
      version_code:
        description: Reserved unused release versionCode
        required: true
        default: '11'
        type: string

permissions:
  contents: read

concurrency:
  group: schoolhop-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_REQUIRE_FIREBASE: 'true'
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      ANDROID_DEBUG_CERT_SHA256: ${{ vars.ANDROID_DEBUG_CERT_SHA256 }}
      SCHOOLHOP_CAPACITOR_API_BASE_URL: https://schoolhop.shourish.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and version
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bcbbd2dff2e8f14acffeba1753b7a5151b798171 HEAD
          python3 - <<'PYTHON'
          import os, re
          code, name = os.environ['ANDROID_VERSION_CODE'], os.environ['ANDROID_VERSION_NAME']
          assert re.fullmatch(r'[1-9][0-9]*', code) and 11 <= int(code) <= 2100000000
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', name)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK and dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          npm ci
      - name: Frontend GPS, push, handover and deep-link regressions
        run: |
          npm test
          npm run typecheck
          npm run lint
          python3 -m unittest discover -s tests -p test_android_debug_signing.py -v
          python3 -m unittest discover -s tests -p test_android_release_signing.py -v
      - name: Configure required Firebase
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: node scripts/configure-android-firebase.js
      - name: Build Android assets and sync plugins
        run: |
          npm_package_version="$ANDROID_VERSION_NAME" node scripts/build-capacitor-web.js
          npx cap sync android
          node scripts/patch-capacitor-android-push.js
      - name: Release JVM tests and lint
        working-directory: android
        run: ./gradlew --no-daemon --no-configuration-cache :app:testReleaseUnitTest :app:lintRelease
      - name: Verify GPS deadline backport compatibility
        run: python3 scripts/test_android_deadline_desugaring.py
      - name: Verify unsigned releases are rejected
        working-directory: android
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon --no-configuration-cache :app:bundleRelease > "$RUNNER_TEMP/unsigned-release-check.log" 2>&1; then
            echo '::error::Release signing accepted missing credentials'
            exit 1
          fi
          grep -q 'Persistent Android upload signing credentials are required' "$RUNNER_TEMP/unsigned-release-check.log"
      - name: Install pinned bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo '2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Stage and verify persistent upload identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android_release_signing.py stage
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/schoolhop-upload-signing/upload-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache bundleRelease
      - name: Verify actual release bundle
        run: >-
          python3 scripts/android_release_signing.py verify
          android/app/build/outputs/bundle/release/app-release.aab
          --bundletool "$RUNNER_TEMP/bundletool.jar"
          --report android-release-verification.json
      - name: Upload verified signed AAB
        id: aab
        uses: actions/upload-artifact@v4
        with:
          name: schoolhop-android-release-${{ env.ANDROID_VERSION_NAME }}-${{ env.ANDROID_VERSION_CODE }}-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload release test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-checks-${{ github.run_id }}
          path: |
            android/app/build/reports/tests/testReleaseUnitTest/
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.xml
          if-no-files-found: warn
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/schoolhop-upload-signing"
          rm -f android/app/google-services.json
      - name: Release summary
        env:
          ARTIFACT_URL: ${{ steps.aab.outputs.artifact-url }}
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Verified signed Android release AAB\n\n')
              for key in ['GITHUB_SHA', 'ANDROID_VERSION_NAME', 'ANDROID_VERSION_CODE', 'ANDROID_UPLOAD_CERT_SHA256', 'ARTIFACT_URL']:
                  output.write(f"- {key}: {os.environ[key]}\n")
              output.write('- Application ID: com.schoolhop.app\n- Play upload: not performed\n')
          PYTHON
