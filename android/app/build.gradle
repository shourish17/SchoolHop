apply plugin: 'com.android.application'

// Debug distribution has its own permanent identity; release signing stays separate.
def debugKeystorePath = System.getenv("ANDROID_DEBUG_KEYSTORE_PATH")
def debugStorePassword = System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
def debugKeyAlias = System.getenv("ANDROID_DEBUG_KEY_ALIAS")
def debugKeyPassword = System.getenv("ANDROID_DEBUG_KEY_PASSWORD")
def debugCertificateSha256 = System.getenv("ANDROID_DEBUG_CERT_SHA256")
def debugCredentials = [debugKeystorePath, debugStorePassword, debugKeyAlias, debugKeyPassword]
def requestedVersionCode = System.getenv("ANDROID_VERSION_CODE") ?: "13"
if (!(requestedVersionCode ==~ /[1-9][0-9]*/) || requestedVersionCode.toBigInteger() < 9 || requestedVersionCode.toBigInteger() > 2100000000) {
    throw new GradleException("Android versionCode must be an integer from 9 to 2100000000")
}
def persistentDebugConfigured = debugCredentials.every { it }
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseCertificateSha256 = System.getenv("ANDROID_UPLOAD_CERT_SHA256")
def releaseCredentials = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def releaseConfigured = releaseCredentials.every { it }
if (releaseCredentials.any { it } && !releaseConfigured) {
    throw new GradleException("All Android upload signing credentials are required")
}
if (releaseConfigured) {
    if (!(releaseCertificateSha256 ==~ /[0-9a-f]{64}/) || releaseCertificateSha256 == debugCertificateSha256) {
        throw new GradleException("A separate pinned Android upload certificate SHA-256 is required")
    }
    try {
        def keystore = java.security.KeyStore.getInstance(file(releaseKeystorePath), releaseStorePassword.toCharArray())
        def certificate = keystore.getCertificate(releaseKeyAlias)
        def signingKey = keystore.getKey(releaseKeyAlias, releaseKeyPassword.toCharArray())
        def actual = certificate == null ? null : java.security.MessageDigest.getInstance("SHA-256")
            .digest(certificate.encoded).encodeHex().toString()
        if (!(signingKey instanceof java.security.PrivateKey) || actual != releaseCertificateSha256) {
            throw new IllegalStateException()
        }
    } catch (Exception ignored) {
        throw new GradleException("Android upload signing identity could not be verified")
    }
}
if (debugCredentials.any { it } && !persistentDebugConfigured) {
    throw new GradleException("All dedicated Android debug signing credentials are required")
}
if (persistentDebugConfigured) {
    if (!(debugCertificateSha256 ==~ /[0-9a-f]{64}/)) {
        throw new GradleException("A pinned Android debug certificate SHA-256 is required")
    }
    try {
        def keystore = java.security.KeyStore.getInstance(file(debugKeystorePath), debugStorePassword.toCharArray())
        def certificate = keystore.getCertificate(debugKeyAlias)
        def signingKey = keystore.getKey(debugKeyAlias, debugKeyPassword.toCharArray())
        def actual = certificate == null ? null : java.security.MessageDigest.getInstance("SHA-256")
            .digest(certificate.encoded).encodeHex().toString()
        if (!(signingKey instanceof java.security.PrivateKey) || actual != debugCertificateSha256) {
            throw new IllegalStateException()
        }
    } catch (Exception ignored) {
        throw new GradleException("Persistent Android debug signing identity could not be verified")
    }
}

android {
    namespace "com.schoolhop.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.schoolhop.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(requestedVersionCode)
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0.26"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            if (persistentDebugConfigured) {
                storeFile file(debugKeystorePath)
                storePassword debugStorePassword
                keyAlias debugKeyAlias
                keyPassword debugKeyPassword
                storeType "PKCS12"
            }
        }
        release {
            if (releaseConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType "PKCS12"
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

// Never fall back to an automatically generated key for an installable debug APK.
// Release-only builds do not need access to the debug private key.
def verifyReleaseUploadSigning = tasks.register("verifyReleaseUploadSigning") {
    doLast {
        if (!releaseConfigured) {
            throw new GradleException("Persistent Android upload signing credentials are required for release builds")
        }
    }
}
tasks.configureEach {
    if (name in ["bundleRelease", "packageRelease", "packageReleaseBundle", "signReleaseBundle", "validateSigningRelease"]) {
        dependsOn verifyReleaseUploadSigning
    }
    if (name == "validateSigningDebug") {
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst {
            if (!persistentDebugConfigured) {
                throw new GradleException("Persistent Android debug signing credentials are required; automatic debug signing is disabled")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '24.1.0'}"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.16.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else if (System.getenv("ANDROID_REQUIRE_FIREBASE") == "true") {
    throw new GradleException("Firebase Android configuration is required for this build")
} else {
    logger.lifecycle("Firebase configuration unavailable; push notifications disabled")
}
