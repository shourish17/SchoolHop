[project]
name = "schoolhop"
version = "0.1.0"
description = "SchoolHop private school carpool PWA and FastAPI backend."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.7.1",
  "pydantic[email]==2.10.5",
  "PyJWT==2.10.1",
  "passlib==1.7.4",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "cryptography==44.0.0",
  "h2==4.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.8.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
